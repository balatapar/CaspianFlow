name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev mesa-utils ninja-build pkg-config clang cmake

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Build APK with Flet
        run: |
          # Patch flet-charts pubspec before build
          python scripts/patch_flet_charts_pubspec.py
          
          # Build APK using flet
          yes | flet build apk --verbose
          
          # The APK is already in build/apk/, verify and rename
          mkdir -p build/apk
          if ls build/apk/*.apk 1>/dev/null 2>&1; then
            APK_PATH=$(find build/apk -maxdepth 1 -type f -name "*.apk" | head -n 1)
            mv "$APK_PATH" build/apk/CaspianFlow-release.apk
            echo "APK ready at build/apk/CaspianFlow-release.apk"
            ls -lh build/apk/
          else
            echo "ERROR: APK not found in build/apk/ after build."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: CaspianWeather-APK
          path: build/apk/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: CaspianWeather ${{ github.sha }}
          body: Automated APK build from commit ${{ github.sha }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
