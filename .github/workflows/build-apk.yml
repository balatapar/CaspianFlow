name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev mesa-utils ninja-build pkg-config clang cmake

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create Flet App Bundle & Build APK
        run: |
          python -m flet build apk --project-name CaspianFlow --verbose || true
          if [ ! -f build/apk/*.apk ]; then
            # fallback in case CLI fails, create flutter project wrapper
            flet create --template app .flet_temp
            cd .flet_temp
            flutter build apk --release
            mkdir -p ../build/apk
            cp build/app/outputs/flutter-apk/app-release.apk ../build/apk/
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaspianWeather-APK
          path: build/apk/*.apk