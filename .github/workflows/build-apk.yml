name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: "stable"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev mesa-utils ninja-build pkg-config clang cmake

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build APK
        run: |
          flet build apk --verbose || true
          if [ ! -f build/apk/*.apk ]; then
            echo "Fallback to direct Flutter build..."
            flet create --template app .flet_temp
            cd .flet_temp
            flutter build apk --release
            cd ..
            mkdir -p build/apk
            cp .flet_temp/build/app/outputs/flutter-apk/app-release.apk build/apk/CaspianFlow-release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaspianWeather-APK
          path: build/apk/*.apk