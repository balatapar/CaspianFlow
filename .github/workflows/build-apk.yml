name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: "stable"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev mesa-utils ninja-build pkg-config clang cmake

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          
          # Fix flet-charts bug: it references flet via a non-existent relative path
          # (path: ../../../../../../../packages/flet). Patch it to use the published
          # version instead so flutter pub get can resolve it in CI.
          CHARTS_PUBSPEC=$(python -c "
import importlib.metadata, pathlib
base = str(importlib.metadata.distribution('flet-charts').locate_file(''))
print(pathlib.Path(base) / 'flutter' / 'flet_charts' / 'pubspec.yaml')
")
          echo "Patching $CHARTS_PUBSPEC"
          python -c "
from pathlib import Path
p = Path('$CHARTS_PUBSPEC'.replace('\\\\','/'))
text = p.read_text()
text = text.replace(
    '    path: ../../../../../../../packages/flet',
    '    version: ^0.86.5'
)
p.write_text(text)
print('Patched pubspec.yaml:')
print(p.read_text())
"

      - name: Build APK Strategy
        run: |
          # ۱. تایید خودکار پرامپت‌ها و ساخت ساختار اولیه فلاتر
          yes | flet build apk --verbose || true
          
          # ۲. ساخت پوشه خروجی مطمئن
          mkdir -p build/apk

          # ۳. پیدا کردن پروژه فلاتر تولید شده و بیلد مستقیم
          FLUTTER_DIR=$(find . -maxdepth 4 -type f -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          
          if [ -n "$FLUTTER_DIR" ]; then
            echo "Found Flutter project at $FLUTTER_DIR"
            cd "$FLUTTER_DIR"
            flutter pub get
            flutter build apk --release
            cd "$GITHUB_WORKSPACE"
            cp "$FLUTTER_DIR/build/app/outputs/flutter-apk/app-release.apk" build/apk/CaspianFlow-release.apk
          else
            echo "ERROR: Flutter project template could not be found."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: CaspianWeather-APK
          path: build/apk/*.apk