name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev mesa-utils ninja-build pkg-config clang cmake

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Build APK Strategy
        run: |
          # پچ کردن باگ pubspec فlet-charts در site-packages قبل از بیلد
          # (flet build apk فایلهای پلاگین را از اینجا کپی میکند)
          python scripts/patch_flet_charts_pubspec.py
          
          # ساخت APK توسط flet
          yes | flet build apk --verbose
          
          # کپی کردن خروجی به پوشه build/apk
          mkdir -p build/apk
          APK_PATH=$(find build -maxdepth 3 -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build/apk/CaspianFlow-release.apk
            echo "APK copied to build/apk/CaspianFlow-release.apk"
          else
            echo "ERROR: APK not found after build."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: CaspianWeather-APK
          path: build/apk/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: CaspianWeather ${{ github.sha }}
          body: Automated APK build from commit ${{ github.sha }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}