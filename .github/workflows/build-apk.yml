name: Build Flet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v5.5.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev mesa-utils ninja-build pkg-config clang cmake

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Build APK Strategy
        run: |
          # پچ کردن باگ pubspec فlet-charts در site-packages قبل از بیلد
          python scripts/patch_flet_charts_pubspec.py
          
          # ساخت پروژه فلاتر توسط flet (بدون بیلد خودکار APK)
          yes | flet build --verbose
          
          # پیدا کردن پروژه فلاتر تولید شده
          FLUTTER_DIR=$(find . -maxdepth 3 -type f -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$FLUTTER_DIR" ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi
          
          echo "Found Flutter project at $FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          
          # پچ کردن pubspec در پروژه تولیدشده
          python "$GITHUB_WORKSPACE/scripts/patch_flet_charts_pubspec.py" || true
          
          # ساخت جداگانه APK برای هر معماری (arm64-v8a, armeabi-v7a, x86_64)
          flutter pub get
          flutter build apk --release --split-per-abi
          
          cd "$GITHUB_WORKSPACE"
          mkdir -p build/apk
          
          # کپی کردن همه APKهای تولید شده
          find "$FLUTTER_DIR/build/app/outputs/flutter-apk" -name "*.apk" -exec cp {} build/apk/ \;
          
          # لیست APKهای تولید شده
          echo "Generated APKs:"
          ls -lh build/apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: CaspianWeather-APK
          path: build/apk/*.apk

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: CaspianWeather ${{ github.sha }}
          body: Automated APK build from commit ${{ github.sha }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
